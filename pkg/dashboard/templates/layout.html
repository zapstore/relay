{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="htmx-config" content='{"historyCacheSize":0,"refreshOnHistoryMiss":true,"scrollIntoViewOnBoost":false,"defaultSwapStyle":"innerHTML"}'>
  <title>{{.Section}} · Zapstore relay</title>
  <link rel="preload" href="/static/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{asset "dashboard.css"}}">
  <link rel="icon" href="/static/assets/zapstore-logo.svg" type="image/svg+xml">
  <script src="{{asset "dashboard.js"}}"></script>
  <script src="{{asset "htmx.min.js"}}" defer></script>
</head>
<body hx-boost="true" hx-target="#content" hx-indicator="#progress">
{{template "sprite"}}
<a class="skip" href="#content">Skip to content</a>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="/apps">
      <span class="brand-mark"><img src="/static/assets/zapstore-logo.svg" alt="" width="11" height="18"></span>
      <span>Zapstore <span class="brand-sub">relay</span></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="/apps" data-section="Apps"{{if eq .Section "Apps"}} aria-current="page"{{end}}>{{icon "grid"}}Apps</a>
      <a href="/publishers" data-section="Publishers"{{if eq .Section "Publishers"}} aria-current="page"{{end}}>{{icon "users"}}Publishers</a>
      <a href="/stats" data-section="Stats"{{if eq .Section "Stats"}} aria-current="page"{{end}}>{{icon "chart"}}Stats</a>
      <a href="/bundles" data-section="Bundles"{{if eq .Section "Bundles"}} aria-current="page"{{end}}>{{icon "package"}}Bundles</a>
      <a href="/moderation" data-section="Moderation"{{if eq .Section "Moderation"}} aria-current="page"{{end}}>{{icon "shield"}}Moderation</a>
    </nav>
    <form class="top-search" action="/apps" method="get" role="search">
      {{icon "search"}}
      <input id="top-q" type="search" name="q" placeholder="Find an app by name or id" aria-label="Find an app" autocomplete="off">
      <kbd>/</kbd>
    </form>
    <div class="top-tools">
      <button class="live" id="live" type="button" aria-pressed="true" title="Refresh lists and status while this tab is visible">
        <span class="dot"></span>Live
      </button>
      <button class="btn ghost icon sm" type="button" id="signout" title="Sign out" aria-label="Sign out">{{icon "log-out"}}</button>
    </div>
  </div>
  <div id="progress"></div>
</header>

<main id="content" hx-get="{{.Path}}" hx-trigger="load" tabindex="-1">
  <div class="skeleton" aria-label="Loading"><i></i><i></i><i></i></div>
</main>

<div id="toast" role="status" aria-live="polite">{{icon "alert"}}<span id="toast-msg"></span><span id="toast-action"></span></div>
</body>
</html>
{{end}}
